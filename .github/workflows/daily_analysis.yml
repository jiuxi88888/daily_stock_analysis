name: 每日股票分析

on:
  schedule:
    - cron: '10 04 * * 1-5'  # 每周一到周五（GitHub 按 UTC 执行，即北京时间 12:10；实测常有数小时延迟）
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'stocks-only'
        type: choice
        options:
          - full
          - market-only
          - stocks-only

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 新增：允许把报告提交回仓库（否则默认权限可能只读）
    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: 'https://api.bianxie.ai/v1'
      AI_MODEL: 'gpt-4o'
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      STOCK_LIST: ${{ vars.STOCK_LIST || '600519,000001,000858' }}
      REPORT_TYPE: 'simple'
      LOG_LEVEL: 'INFO'
      ENABLE_SELECTION: 'true'
      SELECTION_COUNT: '8'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests tushare akshare efinance openai
          fi

      - name: 创建目录
        run: mkdir -p data logs reports

      - name: 执行股票分析
        run: |
          echo "=== 开始股票分析 ==="
          echo "时间: $(date)"
          echo "分析股票: $STOCK_LIST"
          echo "AI接口地址: $OPENAI_BASE_URL"
          echo "AI模型: $AI_MODEL"
          echo "精选功能: $ENABLE_SELECTION"
          echo "精选数量: $SELECTION_COUNT"
          echo "API Key 是否已设置: $([ -n "$OPENAI_API_KEY" ] && echo '是' || echo '否')"
          python main.py
          echo "=== 分析完成 ==="

      - name: 上传报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-reports-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 7

      # ===== 新增：把报告归档回仓库，使其可通过公开 raw 链接直接抓取 =====
      # 说明：.gitignore 忽略了 reports/，因此必须用 git add -f 强制提交。
      # 归档内容：reports/report_YYYYMMDD.md（历史）+ reports/latest.md（最新一期，固定路径）
      - name: 归档报告到仓库
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          if ls reports/report_*.md >/dev/null 2>&1; then
            # 取日期最新的那份作为 latest.md
            latest=$(ls -1 reports/report_*.md | sort | tail -n 1)
            cp "$latest" reports/latest.md
            # 只保留最近 60 天的历史报告，避免仓库膨胀
            ls -1t reports/report_*.md | tail -n +61 | xargs -r rm -f
            git add -f reports/
            if git diff --cached --quiet; then
              echo "报告无变化，跳过提交"
            else
              git commit -m "chore: 归档每日股票分析报告 $(date -u +%Y-%m-%d)"
              git push
              echo "报告已归档"
            fi
          else
            echo "未找到报告文件，跳过归档"
          fi

      - name: 显示结果
        if: always()
        run: |
          echo "分析完成！"
          if [ -d "reports" ]; then
            echo "生成的报告："
            ls -la reports/
          fi
